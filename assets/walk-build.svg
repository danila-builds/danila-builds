<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" width="880" height="128" role="img" aria-label="WHAT I CAN BUILD FOR YOU">
<style>

.leg{animation:leg .46s ease-in-out infinite alternate}
.legL{transform-origin:-6px -13px}
.legR{transform-origin:6px -13px;animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.arm{animation:arm .46s ease-in-out infinite alternate}
.armL{transform-origin:-9px -22px;animation-direction:alternate-reverse}
.armR{transform-origin:9px -22px}
@keyframes arm{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
.bob{animation:bob .23s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.blink{animation:blink 4.2s ease-in-out infinite;transform-origin:0 -38px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.go{animation:go 24s linear infinite}
@keyframes go{0%,2.00%{transform:translateX(-60px)}24.00%,100%{transform:translateX(940px)}}
.dust{animation:dust 24s linear infinite;opacity:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.go{transform:translateX(790px)}}
</style>
