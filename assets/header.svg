<text x="48" y="74" class="m rise" font-size="15" fill="#c65fd6" style="animation-delay:.1s">danila-builds<tspan fill="#b79bbd">  ~  one engineer, a team of agents</tspan></text>
<text x="46" y="128" class="h rise" font-size="44" fill="#f1d9f5" textLength="500" lengthAdjust="spacingAndGlyphs" style="animation-delay:.3s">I BUILD THE SOFTWARE</text>
<text x="46" y="178" class="h rise" font-size="44" fill="#c65fd6" textLength="500" lengthAdjust="spacingAndGlyphs" style="animation-delay:.55s">OPS TEAMS RUN ON</text>
<g clip-path="url(#type)"><text x="48" y="216" class="m" font-size="13.5" fill="#b79bbd">bots / dashboards / alerting / AI tooling for support and payment teams</text></g>
<rect x="48" y="203" width="8" height="16" fill="#c65fd6" class="cur"><animate attributeName="x" from="48" to="640" begin="1.1s" dur="2.6s" fill="freeze"/></rect>
</g>
<rect x="1.5" y="1.5" width="877" height="297" rx="19" fill="none" stroke="#8f3aa3" stroke-width="3"/>
