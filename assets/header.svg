<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Danila builds - I build the software ops teams run on">
<style>
.h{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:-1px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(40deg)}}
.blink{animation:bl 5.5s ease-in-out infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.slide{animation:sl 3.2s linear infinite}
@keyframes sl{from{transform:translateX(0)}to{transform:translateX(-44px)}}
.slide2{animation:sl2 5s linear infinite}
@keyframes sl2{from{transform:translateX(-40px)}to{transform:translateX(0)}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.rise{opacity:1}}
</style>
<defs>
<pattern id="d" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.1" fill="#c65fd6" opacity="0.13"/></pattern>
<clipPath id="card"><rect width="880" height="300" rx="20"/></clipPath>
<clipPath id="type"><rect x="48" y="196" height="30" width="0"><animate attributeName="width" from="0" to="640" begin="1.1s" dur="2.6s" fill="freeze" calcMode="linear"/></rect></clipPath>
<radialGradient id="glow" cx="78%" cy="45%" r="55%"><stop offset="0" stop-color="#c65fd6" stop-opacity=".42"/><stop offset="1" stop-color="#c65fd6" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#card)">
<rect width="880" height="300" fill="#1c061f"/>
<rect width="880" height="300" fill="url(#glow)"/>
<rect width="880" height="300" fill="url(#d)"/>
