<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 190" width="432" height="190" role="img" aria-label="domainscan: Domain trust scanner: 8 parallel checks, a 0-100 score with an explainable breakdown and a PDF report.">
