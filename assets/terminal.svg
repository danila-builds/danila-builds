<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" role="img" aria-label="Terminal: who I am, what I shipped, how I work">
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.r{opacity:0;animation:r .01s linear forwards}
@keyframes r{to{opacity:1}}
.cur{opacity:0;animation:r .01s linear 3.23s forwards, c 1s steps(1) 3.23s infinite}
@keyframes c{50%{opacity:0}}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.r,.cur{opacity:1;animation:none}.tw{animation:none}}
</style>
<defs><pattern id="d" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.1" fill="#c65fd6" opacity="0.09"/></pattern><clipPath id="c"><rect width="880" height="346" rx="16"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="880" height="346" fill="#1c061f"/>
<rect width="880" height="346" fill="url(#d)"/>
<rect width="880" height="48" fill="#2a0b2e"/>
<polygon points="30.0,15.0 32.4,20.7 38.6,21.2 33.9,25.3 35.3,31.3 30.0,28.1 24.7,31.3 26.1,25.3 21.4,21.2 27.6,20.7" fill="#c65fd6"/>
<polygon points="56.0,15.0 58.4,20.7 64.6,21.2 59.9,25.3 61.3,31.3 56.0,28.1 50.7,31.3 52.1,25.3 47.4,21.2 53.6,20.7" fill="#8f3aa3"/>
<polygon points="82.0,15.0 84.4,20.7 90.6,21.2 85.9,25.3 87.3,31.3 82.0,28.1 76.7,31.3 78.1,25.3 73.4,21.2 79.6,20.7" fill="#8f3aa3"/>
<text x="440" y="29" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#b79bbd">danila@builds: ~</text>
<polygon points="840.0,17.0 841.6,21.8 846.7,21.8 842.5,24.8 844.1,29.7 840.0,26.7 835.9,29.7 837.5,24.8 833.3,21.8 838.4,21.8" fill="#f1d9f5" class="tw" style="animation-delay:0.5s;transform-origin:840px 24px"/>
<text x="30" y="84" class="m r" style="animation-delay:0.30s"><tspan fill="#c65fd6">$</tspan><tspan fill="#f1d9f5" dx="9">whoami</tspan></text>
<text x="30" y="109" class="m r" fill="#b79bbd" style="animation-delay:0.75s">Danila. I turn manual ops work into systems that run on their own.</text>
<text x="30" y="148" class="m r" style="animation-delay:1.10s"><tspan fill="#c65fd6">$</tspan><tspan fill="#f1d9f5" dx="9">ls shipped/</tspan></text>
<text x="30" y="173" class="m r" style="animation-delay:1.55s"><tspan fill="#c65fd6">processing-hub</tspan><tspan fill="#b79bbd" x="216">CRM + 10 bots + dashboards, 296 automated checks</tspan></text>
<text x="30" y="198" class="m r" style="animation-delay:1.77s"><tspan fill="#c65fd6">merchant-ops-bots</tspan><tspan fill="#b79bbd" x="216">6 bots + web dashboard for a payment aggregator</tspan></text>
<text x="30" y="223" class="m r" style="animation-delay:1.99s"><tspan fill="#c65fd6">suflyor</tspan><tspan fill="#b79bbd" x="216">live call copilot for macOS, 181 tests</tspan></text>
<text x="30" y="248" class="m r" style="animation-delay:2.21s"><tspan fill="#c65fd6">grailert</tspan><tspan fill="#b79bbd" x="216">marketplace alert bot, paid plans, 7 languages</tspan></text>
<text x="30" y="287" class="m r" style="animation-delay:2.43s"><tspan fill="#c65fd6">$</tspan><tspan fill="#f1d9f5" dx="9">cat how-i-work</tspan></text>
<text x="30" y="312" class="m r" fill="#b79bbd" style="animation-delay:2.88s">scope first, tests and independent review before every release</text>
<rect x="600" y="299" width="9" height="17" fill="#c65fd6" class="cur"/>
</g>
<rect x="1.5" y="1.5" width="877" height="343" rx="15" fill="none" stroke="#8f3aa3" stroke-width="3"/>
</svg>