<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-label="Danila builds. I build the software ops teams run on. Bots, dashboards, alerting and AI tooling for support and payment teams.">
<style>

.leg{animation:leg .46s ease-in-out infinite alternate}
.legL{transform-origin:-6px -13px}
.legR{transform-origin:6px -13px;animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.arm{animation:arm .46s ease-in-out infinite alternate}
.armL{transform-origin:-9px -22px;animation-direction:alternate-reverse}
.armR{transform-origin:9px -22px}
@keyframes arm{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
.bob{animation:bob .23s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.blink{animation:blink 4.2s ease-in-out infinite;transform-origin:0 -38px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.idle{animation:idle 1.6s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes idle{from{transform:translateY(0) scaleY(1)}to{transform:translateY(-1.5px) scaleY(1.025)}}
.wave{animation:wave .5s ease-in-out infinite alternate;transform-origin:9px -22px}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-112deg)}}
.pop{animation:pop 6s ease-in-out infinite;transform-origin:560px 150px}
@keyframes pop{0%,6%{transform:scale(0) rotate(-8deg)}11%{transform:scale(1.08) rotate(2deg)}14%,86%{transform:scale(1) rotate(-2deg)}92%,100%{transform:scale(0) rotate(-8deg)}}
.tag{animation:tag 3s ease-in-out infinite alternate;transform-origin:120px 62px}
@keyframes tag{from{transform:rotate(-4deg)}to{transform:rotate(-1.5deg)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0deg)}50%{transform:scale(1.1) rotate(36deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.pop{transform:rotate(-2deg)}.wave{transform:rotate(-130deg)}}
</style>
