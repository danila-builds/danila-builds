<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="whoami: Danila builds operations software - bots, dashboards, alerting and AI tooling for support and payment teams">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .dim { fill: #8a8a82; }
    .fg { fill: #f5f5f0; }
    .ac { fill: #ff5a1f; }
    .ok { fill: #7ddc8a; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>
  <rect width="880" height="372" rx="14" fill="#0b0b0b"/>
  <rect x="0.5" y="0.5" width="879" height="371" rx="14" fill="none" stroke="#2a2a27"/>
  <circle cx="26" cy="24" r="6" fill="#ff5a1f"/>
  <circle cx="46" cy="24" r="6" fill="#3a3a36"/>
  <circle cx="66" cy="24" r="6" fill="#3a3a36"/>
  <text x="440" y="29" text-anchor="middle" class="t dim" font-size="13">danila@builds: ~</text>
  <line x1="0" y1="46" x2="880" y2="46" stroke="#2a2a27"/>

  <text x="28" y="82" class="t"><tspan class="ac">$</tspan><tspan class="fg"> whoami</tspan></text>
  <text x="28" y="108" class="t fg">Danila - I build the software an operations team runs on.</text>
  <text x="28" y="132" class="t dim">Bots, dashboards, alerting and AI tooling for support and payment teams.</text>

  <text x="28" y="176" class="t"><tspan class="ac">$</tspan><tspan class="fg"> ls shipped/</tspan></text>
  <text x="28" y="202" class="t"><tspan class="ok">processing-hub</tspan><tspan class="dim" x="212">CRM + 10 bots + dashboards, ~45k lines, 296 checks</tspan></text>
  <text x="28" y="226" class="t"><tspan class="ok">merchant-ops-bots</tspan><tspan class="dim" x="212">6 bots + web dashboard for a payment aggregator</tspan></text>
  <text x="28" y="250" class="t"><tspan class="ok">suflyor</tspan><tspan class="dim" x="212">live call copilot for macOS, 181 tests</tspan></text>
  <text x="28" y="274" class="t"><tspan class="ok">grailert</tspan><tspan class="dim" x="212">marketplace alert bot, paid plans, 7 languages</tspan></text>

  <text x="28" y="318" class="t"><tspan class="ac">$</tspan><tspan class="fg"> cat how-i-work</tspan></text>
  <text x="28" y="344" class="t dim">one engineer, a team of agents, tests and review before every release<tspan class="ac cur"> _</tspan></text>
</svg>
